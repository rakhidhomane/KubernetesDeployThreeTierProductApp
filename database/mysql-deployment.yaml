apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
  namespace: product-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      automountServiceAccountToken: false
      # 🔒 Ensure MySQL runs only on worker node
      nodeSelector:
        role: app
      securityContext:
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: mysql
        image: mysql:8.0
        ports:
        - containerPort: 3306
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 200m
            memory: 512Mi
          limits:
            cpu: 1000m
            memory: 1Gi
        env:
        - name: MYSQL_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: mysql-secret
              key: MYSQL_ROOT_PASSWORD
        - name: MYSQL_DATABASE
          valueFrom:
            secretKeyRef:
              name: mysql-secret
              key: MYSQL_DATABASE

        volumeMounts:
        - name: mysql-storage
          mountPath: /var/lib/mysql   # MySQL data directory

        readinessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - MYSQL_PWD="${MYSQL_ROOT_PASSWORD}" mysqladmin ping -h localhost -uroot
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3

        livenessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - MYSQL_PWD="${MYSQL_ROOT_PASSWORD}" mysqladmin ping -h localhost -uroot
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5

      volumes:
      - name: mysql-storage
        persistentVolumeClaim:
          claimName: mysql-pvc
